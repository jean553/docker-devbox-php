---
- hosts: localhost
  become: true
  vars:
    username: 'ubuntu'
    home: '/home/{{ username }}'
  pre_tasks:
    - name: Install stuff from Aptitude
      apt: name={{ item }} state=present update_cache=yes
      with_items:
        - git
        - tig
        - bash-completion # Not included in the docker image
        - postgresql-client
        - tree
        - htop
        - man-db
        - python3
        - python3-pip

  roles:
    - zsh
    - php
    - symfony
    - node
    - neovim
